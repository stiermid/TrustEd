<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9e7e"/>
      <stop offset="100%" style="stop-color:#06604c"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d4f5ec;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background pill/squircle -->
  <rect x="0" y="0" width="80" height="80" rx="20" ry="20" fill="url(#bg)"/>

  <!-- Open book shape -->
  <!-- Left page -->
  <path d="M14 28 C14 26 16 24 20 24 L38 26 L38 56 L20 54 C16 54 14 52 14 50 Z"
    fill="url(#bookGrad)" opacity="0.95"/>
  <!-- Right page -->
  <path d="M66 28 C66 26 64 24 60 24 L42 26 L42 56 L60 54 C64 54 66 52 66 50 Z"
    fill="url(#bookGrad)" opacity="0.85"/>
  <!-- Spine -->
  <line x1="40" y1="26" x2="40" y2="56" stroke="#0d9e7e" stroke-width="1.5"/>

  <!-- Check badge — bottom right corner -->
  <circle cx="57" cy="57" r="13" fill="#06604c"/>
  <circle cx="57" cy="57" r="11" fill="#0d9e7e"/>
  <polyline
    points="50,57 55,63 64,50"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
